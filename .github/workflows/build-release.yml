name: Build and Release SailHighSea SimpleSync

# Windows, Linux and macOS builds.
#   push to main   -> stable release   (v0.0.1, v0.0.2, ...)
#   push to dev    -> pre-release      (v0.0.1-dev-1, v0.0.1-dev-2, ...)
#   push of v* tag -> release for that tag
#   pull request   -> build + tests only
#   Run workflow   -> build + tests only (Actions tab > Run workflow)
on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# One run per branch at a time, so two quick pushes cannot race for the same release tag.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      number: ${{ steps.v.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: v
        run: |
          TAG=$(bash scripts/next-version.sh "$GITHUB_REF")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows is built with MSYS2 (gcc on x64, clang on ARM64), the same kind of toolchain as scripts/build.ps1:
          # one static .exe, no DLLs.
          - name: windows-x64
            os: windows-latest
            shell: 'msys2 {0}'
            generator: '-G Ninja'
            msystem: UCRT64
            pkgs: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
          # Native Windows on ARM. Experimental: if this job fails the release still goes out without its zip.
          - name: windows-arm64
            os: windows-11-arm
            shell: 'msys2 {0}'
            generator: '-G Ninja -DCMAKE_C_COMPILER=clang'
            msystem: CLANGARM64
            pkgs: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-cmake mingw-w64-clang-aarch64-ninja
            experimental: true
          - { name: linux-x64,   os: ubuntu-latest,  shell: bash, generator: '' }
          - { name: macos-arm64, os: macos-latest,   shell: bash, generator: '' }

    continue-on-error: ${{ matrix.experimental == true }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: false
          install: ${{ matrix.pkgs }}

      - name: Install Linux dependencies for raylib
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev

      # raylib 5.5 is bundled in external/raylib (with local patches), so nothing is downloaded.
      - name: Configure
        run: cmake -S . -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release -DSHS_VERSION_STRING="${{ needs.version.outputs.number }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # CMakeLists.txt writes the executable to <repo>/test/.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path test/SailHighSea-SimpleSync.exe -DestinationPath "dist/SailHighSea-SimpleSync-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          chmod +x test/SailHighSea-SimpleSync
          tar -czf "dist/SailHighSea-SimpleSync-${{ matrix.name }}.tar.gz" -C test SailHighSea-SimpleSync

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        run: |
          APP="SailHighSea SimpleSync.app"
          VER="${{ needs.version.outputs.number }}"
          VER="${VER%%-*}"
          mkdir -p "dist/$APP/Contents/MacOS" "dist/$APP/Contents/Resources"
          cp test/SailHighSea-SimpleSync "dist/$APP/Contents/MacOS/SailHighSea-SimpleSync"
          chmod +x "dist/$APP/Contents/MacOS/SailHighSea-SimpleSync"
          # app icon: build icon.icns from the 1024 px master
          ICONSET="$RUNNER_TEMP/icon.iconset"; mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "dist/$APP/Contents/Resources/icon.icns"
          cat > "dist/$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>SailHighSea SimpleSync</string>
            <key>CFBundleDisplayName</key><string>SailHighSea SimpleSync</string>
            <key>CFBundleIdentifier</key><string>com.sailhighsea.simplesync</string>
            <key>CFBundleExecutable</key><string>SailHighSea-SimpleSync</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          EOF
          (cd dist && zip -r -y "SailHighSea-SimpleSync-${{ matrix.name }}.zip" "$APP")
          rm -rf "dist/$APP"

      - uses: actions/upload-artifact@v4
        with:
          name: SailHighSea-SimpleSync-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: SailHighSea SimpleSync ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
